[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/cristianizzo/cleanCraft"

[workspace.dependencies]
# internal
cleancraft-core = { path = "crates/core" }
cleancraft-mcp = { path = "crates/mcp" }
cleancraft-ui-egui = { path = "crates/ui-egui" }

# shared Craft libraries, pinned like every Craft app
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }

# foundation
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
hex = "0.4"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
plist = "1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
blake3 = "1"
unicode-normalization = "0.1"
tempfile = "3"
# rename without replacing (renameat2 RENAME_NOREPLACE / renamex_np RENAME_EXCL), no unsafe in our code
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Threat Check deep scan: reads Apple's XProtect YARA rules (VirusTotal's YARA in Rust, BSD-3)
yara-x = { version = "1.22", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "hash-module", "macho-module", "math-module", "string-module"] }

# ui (egui 0.36: the version craft-libs targets)
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
